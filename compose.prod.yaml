name: arcticworks-identity-prod

# Reference production deployment: nginx (TLS) in front of the API and web
# app, PostgreSQL and Valkey behind. See docs/deployment.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-identity}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-identity}"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-identity}
      REDIS_URL: redis://valkey:6379
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set to https://identity.example.com}
      WEB_ORIGIN: ${PUBLIC_BASE_URL}
      ALLOWED_ORIGINS: ${PUBLIC_BASE_URL}
      SECURE_COOKIES: "true"
      TRUST_PROXY: "true"
      RP_ID: ${RP_ID:-identity.example.com}
      RP_ORIGINS: ${PUBLIC_BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-ArcticWorks Identity <no-reply@identity.example.com>}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      LOG_FORMAT: json
      RUST_LOG: info,tower_http=info,sqlx=warn
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: "3000"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Place your TLS certificate and key here, or terminate TLS elsewhere
      # and set nginx to plain HTTP behind that proxy.
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
