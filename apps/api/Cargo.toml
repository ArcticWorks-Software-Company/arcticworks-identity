[package]
name = "identity-api"
version = "0.1.0"
edition = "2024"
description = "ArcticWorks Identity — centralized identity and access platform"
license = "MIT"

[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "keys"
path = "src/bin/keys.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "catch-panic"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
jsonwebtoken = "9"
rsa = { version = "0.9", features = ["pem", "sha2"] }
ciborium = "0.2"
p256 = "0.13"
ed25519-dalek = "2"
signature = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls-tls", "hostname"] }
redis = { version = "0.28", features = ["tokio-comp", "connection-manager"] }
utoipa = { version = "5", features = ["uuid", "chrono"] }
utoipa-axum = "0.1"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
url = "2"
dashmap = "6"
secrecy = "0.10"
subtle = "2"
dotenvy = "0.15"
hmac = "0.12"
sha1 = "0.10"
aes-gcm = "0.10"
data-encoding = "2"
