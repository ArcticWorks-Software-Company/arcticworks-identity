name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity -d identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://identity:identity@localhost:5432/identity
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - run: cargo check --locked --all-targets --manifest-path apps/api/Cargo.toml
      - run: cargo test --locked --manifest-path apps/api/Cargo.toml
      - run: cargo build --locked --release --bins --manifest-path apps/api/Cargo.toml

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:sdk
      - run: npm run check -w packages/identity-sdk
      - run: npm run check:web
      - run: npm run check -w examples/continuity-mock
      - run: npm run test:sdk
      - run: npm run test:web
      - run: npm run build:web
      - run: npm run build -w examples/continuity-mock
      - run: npm audit --audit-level=high

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          working-directory: apps/api
